<svg xmlns="http://www.w3.org/2000/svg" width="1124.4" height="629.3" viewBox="17.0 68.0 1124.4 629.3">
<title>Internal architecture</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker><marker id="arwBF8F00" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#BF8F00"/></marker><marker id="arwBF8F00s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#BF8F00"/></marker><marker id="arwC00000" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#C00000"/></marker><marker id="arwC00000s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#C00000"/></marker></defs>
<rect x="17.0" y="68.0" width="1124.4" height="629.3" fill="#FFFFFF"/>
<rect x="30.24" y="128.50" width="1062.05" height="555.59" fill="#FDE9D9" stroke="#843C0C" stroke-width="3.02"/><text x="43.46" y="149.26" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">axi_firewall_top</text><rect x="162.52" y="170.08" width="313.70" height="173.86" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="319.37" y="190.08" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Write datapath</text><text x="173.86" y="211.13" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">wr_state:  IDLE → EVAL → FWD → RESP</text><text x="173.86" y="247.74" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">captures AWADDR / WDATA, applies the</text><text x="173.86" y="267.01" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">rule verdict, forwards or synthesises an</text><text x="173.86" y="286.28" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">error response, and runs the round-trip</text><text x="173.86" y="305.55" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">timeout counter wr_timeout_cnt.</text><rect x="162.52" y="359.06" width="313.70" height="173.86" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="319.37" y="379.06" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Read datapath</text><text x="173.86" y="400.11" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">rd_state:  IDLE → EVAL → FWD → RESP</text><text x="173.86" y="436.72" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">mirrors the write path with its own</text><text x="173.86" y="455.99" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">capture registers, its own lookup port</text><text x="173.86" y="475.26" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">and its own fault signals. Denied reads</text><text x="173.86" y="494.53" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">drive RDATA to zero.</text><rect x="162.52" y="548.03" width="313.70" height="113.39" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="173.86" y="568.79" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Downstream recovery</text><text x="173.86" y="588.72" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">downstream_broken, cleared only by</text><text x="173.86" y="602.59" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">RECOVERY.UNBLOCK</text><text x="173.86" y="621.66" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Blocks forwarding regardless of AUTO_ISOLATE_EN.</text><text x="173.86" y="640.93" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Tracks WR/RD_RESP_BUSY and WR/RD_CMD_STUCK.</text><rect x="638.74" y="170.08" width="423.31" height="355.28" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="651.97" y="190.84" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#375623" xml:space="preserve">axi_firewall_regs</text><rect x="653.86" y="202.20" width="393.07" height="47.24" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="850.39" y="218.15" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">AXI4-Lite control slave</text><text x="850.39" y="231.72" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">single-outstanding, backpressured</text><rect x="653.86" y="257.01" width="393.07" height="79.37" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="850.39" y="272.96" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">Rule table  [0 .. NUM_RULES-1]</text><text x="850.39" y="300.20" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">rule_base / rule_limit / rule_perm</text><text x="850.39" y="314.07" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">rule_perm = {valid, wr_en, rd_en}</text><rect x="653.86" y="343.94" width="188.98" height="69.92" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="748.35" y="359.88" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">Lookup port W</text><text x="748.35" y="373.46" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">combinational,</text><text x="748.35" y="386.46" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">lowest index wins</text><rect x="857.95" y="343.94" width="188.98" height="69.92" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="952.44" y="359.88" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">Lookup port R</text><text x="952.44" y="373.46" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">combinational,</text><text x="952.44" y="386.46" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">independent of W</text><rect x="653.86" y="421.42" width="393.07" height="85.04" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="850.39" y="437.36" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">Control / status / IRQ</text><text x="850.39" y="464.61" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">CTRL   STATUS (sticky, W1C)   IRQ_ENABLE</text><text x="850.39" y="478.48" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">TIMEOUT_VALUE   FAULT_ADDR   FAULT_INFO</text><line x1="476.22" y1="249.45" x2="638.74" y2="249.45" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="557.48" y="238.34" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">chk_w_*</text><line x1="476.22" y1="438.43" x2="638.74" y2="438.43" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="548.03" y="427.32" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">chk_r_*</text><polyline points="476.22,313.70 600.94,313.70 600.94,502.68 638.74,502.68" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="481.89" y="302.60" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">fault_*</text><polyline points="638.74,476.22 555.59,476.22 555.59,600.94 476.22,600.94" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="481.89" y="589.84" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">unblock</text><polyline points="476.22,625.51 627.40,625.51 627.40,285.35 476.22,285.35" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="170.08" y="676.77" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">forward_blocked, global_enable, isolate_effective, timeout_value</text><rect x="37.80" y="222.99" width="102.05" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="88.82" y="245.31" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">s_axi</text><text x="88.82" y="267.15" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">write</text><line x1="139.84" y1="240.76" x2="162.52" y2="240.76" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="37.80" y="411.97" width="102.05" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="88.82" y="434.29" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">s_axi</text><text x="88.82" y="456.12" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">read</text><line x1="139.84" y1="429.73" x2="162.52" y2="429.73" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="933.54" y="81.26" width="128.50" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="997.80" y="103.58" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">s_axi_ctrl</text><line x1="997.80" y1="117.17" x2="997.80" y2="170.08" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="661.42" y="81.26" width="83.15" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="702.99" y="103.58" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">irq</text><line x1="702.99" y1="170.08" x2="702.99" y2="117.17" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="1056.38" y="528.19" width="71.81" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="1092.28" y="550.51" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">m_axi</text><polyline points="476.22,330.71 491.34,330.71 491.34,546.14 1056.38,546.14" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><polyline points="476.22,519.69 491.34,519.69" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="657.64" y="535.04" text-anchor="start" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">(AW, W, B, AR, R)</text><text x="657.64" y="633.22" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" font-style="italic" fill="#595959" xml:space="preserve">(v2.0: no peripheral reset output)</text>
</svg>
