<text x="10" y="368" font-size="10" fill="#404040">The peripheral never raises AWREADY. TIMEOUT_VALUE is 12 clocks in this capture.</text>
<text x="10" y="384" font-size="10" fill="#404040">On expiry the core answers SLVERR upstream so the master never hangs, and latches downstream_broken.</text>
<text x="10" y="400" font-size="10" fill="#404040">m_axi_awvalid stays asserted: AXI forbids withdrawing VALID before READY. Only UNBLOCK may drop it.</text>
