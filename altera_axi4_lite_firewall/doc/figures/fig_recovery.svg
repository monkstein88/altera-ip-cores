<text x="10" y="342" font-size="10" fill="#404040">Write 0x04 acknowledges the fault (irq drops). The peripheral reset is driven by the system, not the core.</text>
<text x="10" y="358" font-size="10" fill="#404040">Write 0x1C pulses unblock: downstream_broken clears and the stuck m_axi_awvalid is withdrawn in the same event.</text>
<text x="10" y="374" font-size="10" fill="#404040">The final write completes with OKAY, showing forwarding has reopened.</text>
