959" xml:space="preserve">forwarded</text><polyline points="126.61,415.75 126.61,468.66 262.68,468.66" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="188.98" y="483.93" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">AXI4-Lite  config / status</text><text x="37.80" y="524.16" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">Separate port on purpose: configuring or inspecting the</text><text x="37.80" y="537.16" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">firewall must never be blockable by a firewall rule, nor</text><text x="37.80" y="550.16" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">by an isolated peripheral.</text><polyline points="597.17,133.04 126.61,133.04 126.61,279.69" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><text x="406.30" y="122.99" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">irq   (level, cleared by W1C on STATUS)</text><rect x="816.38" y="461.10" width="279.69" height="117.17" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="827.72" y="480.15" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" font-weight="bold" fill="#BF8F00" xml:space="preserve">Peripheral reset (yours)</text><text x="827.72" y="498.07" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">Recovering from a timeout requires resetting the</text><text x="827.72" y="511.07" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">protected peripheral before writing</text><text x="827.72" y="524.07" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">RECOVERY.UNBLOCK. v2.0 removed the reset output,</text><text x="827.72" y="537.07" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">so this is now a software step.</text><polyline points="956.22,461.10 956.22,415.75" fill="none" stroke="#BF8F00" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwBF8F00)"/><rect x="34.02" y="627.40" width="185.20" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="126.61" y="653.62" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">clock / reset</text><text x="126.61" y="667.19" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">system clock domain</text><polyline points="126.61,627.40 126.61,589.61 551.81,589.61 551.81,563.15" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="415.75" y="601.64" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">clk, resetn  (single clock domain, synchronous reset)</text><rect x="650.08" y="619.84" width="434.65" height="113.39" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="661.42" y="641.74" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Legend</text><line x1="665.20" y1="663.31" x2="721.89" y2="663.31" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="733.23" y="663.24" text-anc