<text x="10" y="338" font-size="10" fill="#404040">The address falls in a write-only rule. RD_EVAL rejects it and answers SLVERR from RD_RESP.</text>
<text x="10" y="354" font-size="10" fill="#404040">m_axi_arvalid never asserts - the peripheral is not touched. RDATA is driven to zero, not left stale.</text>
<text x="10" y="370" font-size="10" fill="#404040">irq asserts because STATUS.PERM_VIOLATION is sticky and its interrupt is enabled.</text>
