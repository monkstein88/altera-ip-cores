<text x="10" y="342" font-size="10" fill="#404040">Word 0x01 (byte 0x04) acknowledges the fault and irq drops. The peripheral reset is driven by the system, not by the core.</text>
<text x="10" y="358" font-size="10" fill="#404040">Word 0x07 (byte 0x1C) pulses unblock WHILE THE PERIPHERAL IS STILL IN RESET. downstream_broken and rd_stuck clear together, and the held m0_read is withdrawn where the peripheral cannot observe it.</text>
<text x="10" y="374" font-size="10" fill="#404040">Doing this after releasing the reset would let the peripheral handshake the held command first - latching a transaction already reported as failed.</text>
<text x="10" y="390" font-size="10" fill="#404040">The write burst at the end shows forwarding has reopened.</text>
</svg>