<text x="10" y="342" font-size="10" fill="#404040">A 4-beat read burst into a write-only window. m0_read never asserts - the protected peripheral is not touched at all.</text>
<text x="10" y="358" font-size="10" fill="#404040">The command is ACCEPTED immediately (waitrequest stays low) rather than stalled: stalling it would move the hang from the peripheral into the firewall.</text>
<text x="10" y="374" font-size="10" fill="#404040">Avalon-MM has no way to refuse, so the core owes the master four beats and synthesises them itself. rd_deny_beats is that debt counting down. Data is driven to zero, not left stale.</text>
</svg>