<svg xmlns="http://www.w3.org/2000/svg" width="986.5" height="820.2" viewBox="32.1 17.0 986.5 820.2">
<title>Verdict</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker><marker id="arwBF8F00" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#BF8F00"/></marker><marker id="arwBF8F00s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#BF8F00"/></marker><marker id="arwC00000" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#C00000"/></marker><marker id="arwC00000s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#C00000"/></marker></defs>
<rect x="32.1" y="17.0" width="986.5" height="820.2" fill="#FFFFFF"/>
<text x="45.35" y="46.46" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#1F3864" xml:space="preserve">How one transaction is judged</text><text x="45.35" y="71.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" font-style="italic" fill="#595959" xml:space="preserve">Evaluated combinationally at the first beat, then held for the whole burst.</text><rect x="75.59" y="109.61" width="317.48" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="234.33" y="142.81" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">downstream blocked or isolated?</text><line x1="393.07" y1="137.95" x2="506.46" y2="137.95" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="506.46" y="109.61" width="241.89" height="56.69" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="627.40" y="142.08" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">yes → SLAVEERROR</text><text x="763.46" y="130.33" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">no new fault is latched</text><polyline points="234.33,166.30 234.33,198.43" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="75.59" y="198.43" width="317.48" height="56.69" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="234.33" y="231.62" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">GLOBAL_ENABLE = 0 ?</text><line x1="393.07" y1="226.77" x2="506.46" y2="226.77" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><rect x="506.46" y="198.43" width="241.89" height="56.69" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="627.40" y="230.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" font-weight="bold" fill="#375623" xml:space="preserve">yes → forward</text><text x="763.46" y="219.15" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">bypass skips the rule check only</text><polyline points="234.33,255.12 234.33,287.24" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="75.59" y="287.24" width="317.48" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="234.33" y="320.44" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">any valid window holds the first byte?</text><line x1="393.07" y1="315.59" x2="506.46" y2="315.59" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="506.46" y="287.24" width="241.89" height="56.69" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="627.40" y="319.72" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">no → DECODEERROR</text><text x="763.46" y="307.97" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">STATUS.ADDR_VIOLATION</text><polyline points="234.33,343.94 234.33,376.06" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="75.59" y="376.06" width="317.48" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="234.33" y="409.26" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">does that window permit this direction?</text><line x1="393.07" y1="404.41" x2="506.46" y2="404.41" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="506.46" y="376.06" width="241.89" height="56.69" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="627.40" y="408.53" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">no → SLAVEERROR</text><text x="763.46" y="396.79" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">STATUS.PERM_VIOLATION</text><polyline points="234.33,432.76 234.33,464.88" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="75.59" y="464.88" width="317.48" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="234.33" y="498.08" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">does it also hold the LAST byte?</text><line x1="393.07" y1="493.23" x2="506.46" y2="493.23" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="506.46" y="464.88" width="241.89" height="56.69" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="627.40" y="497.35" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">no → DECODEERROR</text><text x="763.46" y="485.60" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">STATUS.BURST_VIOLATION  type 4</text><polyline points="234.33,521.57 234.33,553.70" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="75.59" y="553.70" width="317.48" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="234.33" y="586.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">if a burst, does it permit bursts?</text><line x1="393.07" y1="582.05" x2="506.46" y2="582.05" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="506.46" y="553.70" width="241.89" height="56.69" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="627.40" y="586.17" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">no → SLAVEERROR</text><text x="763.46" y="574.42" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">STATUS.BURST_VIOLATION  type 5</text><rect x="75.59" y="642.52" width="317.48" height="56.69" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="234.33" y="675.72" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">forward to m0</text><polyline points="234.33,610.39 234.33,642.52" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="506.46" y="634.96" width="498.90" height="75.59" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="755.91" y="650.23" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Direction is checked BEFORE extent, so a write burst into a read-only window</text><text x="755.91" y="664.97" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">reports a permission violation rather than a confusing burst error.</text><rect x="45.35" y="740.79" width="960.00" height="83.15" fill="#FDECEC" stroke="#C00000" stroke-width="1.51"/><text x="525.35" y="758.09" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">Every refusal still COMPLETES the transaction upstream.</text><text x="525.35" y="773.39" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Avalon-MM has no abort: a refused N-beat read must still produce N beats of readdatavalid, and a refused write must still have all N beats consumed.</text>
</svg>
