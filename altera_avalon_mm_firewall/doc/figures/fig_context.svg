<svg xmlns="http://www.w3.org/2000/svg" width="1062.0" height="721.9" viewBox="20.8 115.3 1062.0 721.9">
<title>System context</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker><marker id="arwBF8F00" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#BF8F00"/></marker><marker id="arwBF8F00s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#BF8F00"/></marker><marker id="arwC00000" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#C00000"/></marker><marker id="arwC00000s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#C00000"/></marker></defs>
<rect x="20.8" y="115.3" width="1062.0" height="721.9" fill="#FFFFFF"/>
<rect x="34.02" y="249.45" width="188.98" height="128.50" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="128.50" y="296.94" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="14.67" font-weight="bold" fill="#000000" xml:space="preserve">Bus master</text><text x="128.50" y="326.30" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">Nios II data master, mSGDMA,</text><text x="128.50" y="341.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">or any Avalon-MM host</text><rect x="325.04" y="128.50" width="453.54" height="430.87" fill="#FDE9D9" stroke="#843C0C" stroke-width="3.02"/><text x="551.81" y="148.51" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">avl_mm_firewall_top</text><text x="551.81" y="175.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" font-style="italic" fill="#595959" xml:space="preserve">burst-capable access control  +  fault isolation</text><rect x="289.13" y="287.24" width="71.81" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="325.04" y="309.56" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">s0</text><rect x="742.68" y="287.24" width="71.81" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="778.58" y="309.56" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">m0</text><rect x="515.91" y="523.46" width="71.81" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="551.81" y="545.79" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">csr</text><text x="551.81" y="213.83" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">A gate, not a buffer.</text><text x="551.81" y="229.14" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Permitted traffic passes straight through:</text><text x="551.81" y="243.87" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">no added latency, no data storage.</text><text x="551.81" y="366.77" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">Refused traffic never reaches m0 —</text><text x="551.81" y="381.50" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">the firewall answers the master itself,</text><text x="551.81" y="396.23" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">beat for beat.</text><rect x="880.63" y="249.45" width="188.98" height="128.50" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="975.12" y="296.94" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="14.67" font-weight="bold" fill="#000000" xml:space="preserve">Protected peripheral</text><text x="975.12" y="326.30" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">Avalon-MM agent, bursting</text><text x="975.12" y="341.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">or not</text><rect x="415.75" y="650.08" width="272.13" height="90.71" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="551.81" y="692.97" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="14.67" font-weight="bold" fill="#000000" xml:space="preserve">Processor</text><text x="551.81" y="709.33" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">configures rules, handles irq</text><rect x="808.82" y="650.08" width="260.79" height="90.71" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="939.21" y="692.97" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="14.67" font-weight="bold" fill="#000000" xml:space="preserve">Peripheral reset</text><text x="939.21" y="709.33" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">PIO or reset bridge — YOURS, not the core's</text><line x1="222.99" y1="305.39" x2="289.13" y2="305.39" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><line x1="814.49" y1="305.39" x2="880.63" y2="305.39" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="272.13" y="274.71" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">Avalon-MM</text><text x="839.06" y="274.71" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">Avalon-MM</text><polyline points="551.81,650.08 551.81,559.37" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="619.84" y="614.86" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">csr — never blockable</text><polyline points="657.64,544.25 740.79,544.25 740.79,695.43 687.87,695.43" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><text x="789.92" y="585.98" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">irq</text><polyline points="941.10,650.08 941.10,377.95" fill="none" stroke="#BF8F00" stroke-width="2.27" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="6.8,4.5" marker-end="url(#arwBF8F00)"/><text x="1016.69" y="517.95" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" font-weight="bold" fill="#BF8F00" xml:space="preserve">reset for recovery</text><rect x="34.02" y="468.66" width="264.57" height="173.86" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="166.30" y="485.96" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">Address map is unchanged</text><text x="166.30" y="514.27" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">s0 declares bridgesToMaster m0, so</text><text x="166.30" y="529.00" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">s0's address space IS m0's. Inserting</text><text x="166.30" y="543.73" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">the firewall into an existing path</text><text x="166.30" y="558.47" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">moves nothing.</text><rect x="34.02" y="665.20" width="264.57" height="158.74" fill="#FDECEC" stroke="#C00000" stroke-width="1.51"/><text x="166.30" y="682.50" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">Not optional</text><text x="166.30" y="710.80" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Without a software-controllable</text><text x="166.30" y="725.54" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">peripheral reset, recovery from a</text><text x="166.30" y="740.27" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">timeout cannot complete.</text>
</svg>
