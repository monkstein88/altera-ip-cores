<svg xmlns="http://www.w3.org/2000/svg" width="1118.7" height="698.8" viewBox="-3.8 24.6 1118.7 698.8">
<title>Internal architecture</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker><marker id="arwBF8F00" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#BF8F00"/></marker><marker id="arwBF8F00s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#BF8F00"/></marker><marker id="arwC00000" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#C00000"/></marker><marker id="arwC00000s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#C00000"/></marker></defs>
<rect x="-3.8" y="24.6" width="1118.7" height="698.8" fill="#FFFFFF"/>
<rect x="45.35" y="37.80" width="1020.47" height="642.52" fill="#FDE9D9" stroke="#843C0C" stroke-width="3.02"/><text x="555.59" y="57.80" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">avl_mm_firewall_top</text><rect x="9.45" y="173.86" width="71.81" height="41.57" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="45.35" y="199.01" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">s0</text><rect x="1029.92" y="173.86" width="71.81" height="41.57" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="1065.83" y="199.01" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">m0</text><rect x="362.83" y="136.06" width="385.51" height="117.17" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="555.59" y="184.77" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">PASS-THROUGH GATE</text><text x="555.59" y="200.07" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">m0_read/m0_write = s0 gated by the verdict</text><text x="555.59" y="214.80" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">s0_waitrequest = m0_waitrequest, unmodified</text><line x1="83.15" y1="194.65" x2="362.83" y2="194.65" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><line x1="748.35" y1="194.65" x2="1029.92" y2="194.65" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="113.39" y="302.36" width="211.65" height="98.27" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="219.21" y="342.05" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">BURST EXTENT</text><text x="219.21" y="356.68" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">last = addr + count·bytes − 1</text><text x="219.21" y="371.22" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">+ wrap detect</text><polyline points="219.21,302.36 219.21,253.23" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><polyline points="219.21,253.23 219.21,194.65" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="362.83" y="302.36" width="385.51" height="173.86" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="555.59" y="352.65" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#375623" xml:space="preserve">RULE LOOKUP  ×2  (read, write)</text><text x="555.59" y="381.72" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">lowest-index valid window containing</text><text x="555.59" y="396.45" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">the FIRST byte wins; the SAME window</text><text x="555.59" y="411.18" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">must also contain the LAST byte</text><text x="555.59" y="438.92" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" font-style="italic" fill="#595959" xml:space="preserve">purely combinational — this is the critical path</text><line x1="325.04" y1="351.50" x2="362.83" y2="351.50" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><polyline points="555.59,302.36 555.59,253.23" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="665.20" y="279.84" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" font-weight="bold" fill="#375623" xml:space="preserve">verdict</text><rect x="801.26" y="302.36" width="234.33" height="173.86" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="918.43" y="352.11" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#C00000" xml:space="preserve">DENY RESPONDER</text><text x="918.43" y="380.42" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">synthesises one beat</text><text x="918.43" y="395.15" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">per cycle until the</text><text x="918.43" y="409.88" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">burst's debt is paid</text><text x="918.43" y="436.94" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="10.67" fill="#000000" xml:space="preserve">rd_deny_beats</text><polyline points="918.43,302.36 918.43,272.13 83.15,272.13 83.15,219.21" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><text x="226.77" y="257.16" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">refused traffic is answered here, never forwarded</text><rect x="113.39" y="506.46" width="317.48" height="147.40" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="272.13" y="542.54" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">PROGRESS WATCHDOG</text><text x="272.13" y="570.85" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">counts cycles WITHOUT PROGRESS,</text><text x="272.13" y="585.58" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">not transaction length</text><text x="272.13" y="613.32" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">on expiry: complete upstream, block,</text><text x="272.13" y="628.05" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">FREEZE any unhandshaked command</text><rect x="476.22" y="506.46" width="272.13" height="147.40" fill="#FDECEC" stroke="#C00000" stroke-width="1.51"/><text x="612.28" y="522.40" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">downstream_broken</text><text x="612.28" y="550.33" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">blocks all forwarding</text><text x="612.28" y="565.06" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">regardless of the</text><text x="612.28" y="579.79" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">isolate bits</text><text x="612.28" y="607.53" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#C00000" xml:space="preserve">cleared ONLY by UNBLOCK</text><line x1="430.87" y1="578.27" x2="476.22" y2="578.27" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><polyline points="612.28,506.46 612.28,476.22" fill="none" stroke="#C00000" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="801.26" y="506.46" width="234.33" height="147.40" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="918.43" y="550.01" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#375623" xml:space="preserve">REGISTER BLOCK</text><text x="918.43" y="579.08" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">rule table</text><text x="918.43" y="593.82" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">sticky status + irq</text><text x="918.43" y="608.55" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">fault latch</text><text x="918.43" y="623.28" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">recovery</text><line x1="748.35" y1="578.27" x2="801.26" y2="578.27" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="918.43,506.46 918.43,476.22" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><rect x="519.69" y="659.53" width="71.81" height="35.91" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="555.59" y="681.85" text-anchor="middle" font-family="Liberation Mono, sans-serif" font-size="12.00" font-weight="bold" fill="#000000" xml:space="preserve">csr</text><polyline points="555.59,695.43 555.59,653.86" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="551.81" y="706.93" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" font-style="italic" fill="#595959" xml:space="preserve">There is no data storage anywhere in the data path. Refused traffic is the only thing the core generates itself.</text>
</svg>
