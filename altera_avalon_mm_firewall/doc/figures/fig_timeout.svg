<text x="10" y="372" font-size="10" fill="#404040">The peripheral holds m0_waitrequest high forever. TIMEOUT_VALUE is 10 cycles in this capture; a real system uses thousands.</text>
<text x="10" y="388" font-size="10" fill="#404040">On expiry the core completes the transaction upstream itself - four SLAVEERROR beats - so the master never hangs, and latches downstream_broken.</text>
<text x="10" y="404" font-size="10" fill="#404040">m0_read STAYS ASSERTED. Avalon-MM forbids withdrawing a command before waitrequest falls; rd_stuck records that the core is holding one. Only RECOVERY.UNBLOCK may drop it.</text>
