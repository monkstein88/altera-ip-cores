<text x="10" y="342" font-size="10" fill="#404040">A 4-beat write burst into a window that permits writes and bursts.</text>
<text x="10" y="358" font-size="10" fill="#404040">m0 is s0 gated by the rule lookup: the same beats, the same cycle, no buffering. s0_waitrequest is m0_waitrequest unmodified, so the core adds no latency at all.</text>
<text x="10" y="374" font-size="10" fill="#404040">The address is meaningful only on the first beat; wr_beats_left is what holds the burst together, and the verdict formed at beat 1 governs all four.</text>
