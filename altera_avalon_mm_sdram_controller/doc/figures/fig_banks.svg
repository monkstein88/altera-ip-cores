<svg xmlns="http://www.w3.org/2000/svg" width="954.3" height="408.2" viewBox="24.6 9.4 954.3 408.2">
<title>fig_banks</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker></defs>
<rect x="24.6" y="9.4" width="954.3" height="408.2" fill="#FFFFFF"/>
<text x="37.80" y="42.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="20.00" font-weight="bold" fill="#1F3864" xml:space="preserve">One open row, or one per bank</text><text x="37.80" y="88.43" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="12.67" font-weight="bold" fill="#C00000" xml:space="preserve">Single open row</text><rect x="37.80" y="109.61" width="434.65" height="34.02" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="255.12" y="130.74" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">one row register for the whole device</text><rect x="37.80" y="158.74" width="102.05" height="49.13" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.89"/><text x="88.82" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 0</text><rect x="149.29" y="158.74" width="102.05" height="49.13" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="200.31" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 1</text><rect x="260.79" y="158.74" width="102.05" height="49.13" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="311.81" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 2</text><rect x="372.28" y="158.74" width="102.05" height="49.13" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="423.31" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 3</text><text x="37.80" y="230.70" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">An access to any other bank must close the open row and open a new one:</text><text x="37.80" y="245.44" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">PRECHARGE, tRP, ACTIVATE, tRCD. So must a read after a write, because the fast</text><text x="37.80" y="260.17" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">path also requires the direction to match.</text><text x="529.13" y="88.43" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="12.67" font-weight="bold" fill="#2E7D32" xml:space="preserve">One open row per bank</text><rect x="529.13" y="109.61" width="434.65" height="34.02" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="746.46" y="130.98" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">row_open[4], open_row[4]</text><rect x="529.13" y="158.74" width="102.05" height="49.13" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.89"/><text x="580.16" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 0</text><rect x="640.63" y="158.74" width="102.05" height="49.13" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.89"/><text x="691.65" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 1</text><rect x="752.13" y="158.74" width="102.05" height="49.13" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.89"/><text x="803.15" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 2</text><rect x="863.62" y="158.74" width="102.05" height="49.13" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.89"/><text x="914.65" y="187.43" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bank 3</text><text x="529.13" y="230.70" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Four rows stay open at once. An access to another bank needs no row command at all,</text><text x="529.13" y="245.44" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">and a read/write turnaround inside an open row costs 0 cycles write-to-read and</text><text x="529.13" y="260.17" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">CAS+1 read-to-write, with no row command either way.</text><rect x="37.80" y="332.60" width="925.98" height="71.81" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="43.46" y="347.87" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">This is the whole design, and it is measurable rather than arguable. Four banks with one row open in each, accessed in rotation, needs exactly four ACTIVATEs and no PRECHARGE -</text><text x="43.46" y="362.60" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">which is what the testbench asserts, and what takes that access pattern from 21.9 MB/s to 195.5 MB/s.</text>
</svg>
