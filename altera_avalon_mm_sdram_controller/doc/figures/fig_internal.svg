<text x="37.80" y="42.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="20.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Internal architecture</text><rect x="30.24" y="71.81" width="944.88" height="374.17" fill="#FDE9D9" stroke="#843C0C" stroke-width="3.02"/><text x="35.91" y="91.81" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">  avalon_mm_sdram_controller</text><rect x="52.91" y="136.06" width="143.62" height="56.69" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="124.72" y="161.17" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">s1 slave</text><text x="124.72" y="175.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">az_ / za_</text><rect x="226.77" y="136.06" width="151.18" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="302.36" y="161.17" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">command FIFO</text><text x="302.36" y="175.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">FIFO_DEPTH deep</text><polyline points="196.54,164.41 226.77,164.41" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="408.19" y="109.61" width="264.57" height="128.50" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="413.86" y="124.88" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">  scheduler</text><text x="413.86" y="154.34" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">  row open     -&gt;  column command</text><text x="413.86" y="169.08" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">  wrong row    -&gt;  PRECHARGE</text><text x="413.86" y="183.81" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">  bank closed  -&gt;  ACTIVATE</text><text x="413.86" y="198.54" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">  otherwise    -&gt;  look ahead one</text><polyline points="377.95,164.41 408.19,164.41" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="702.99" y="136.06" width="120.94" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="763.46" y="161.17" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">command</text><text x="763.46" y="175.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">registers</text><polyline points="672.76,164.41 702.99,164.41" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="854.17" y="136.06" width="98.27" height="56.69" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.51"/><text x="903.31" y="161.17" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">wire</text><text x="903.31" y="175.90" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">conduit</text><polyline points="823.94,164.41 854.17,164.41" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="408.19" y="264.57" width="124.72" height="56.69" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="470.55" y="289.67" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">row_open[ ]</text><text x="470.55" y="304.41" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">open_row[ ]</text><rect x="548.03" y="264.57" width="124.72" height="56.69" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="610.39" y="289.67" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">timing gates</text><text x="610.39" y="304.41" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">per bank</text><polyline points="470.55,264.57 470.55,238.11" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="610.39,264.57 610.39,238.11" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><rect x="408.19" y="347.72" width="264.57" height="49.13" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="540.47" y="376.41" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">refresh timer - postponed up to REF_MAX_PEND</text><polyline points="540.47,347.72 540.47,321.26" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><rect x="702.99" y="264.57" width="120.94" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="763.46" y="289.67" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">read pipeline</text><text x="763.46" y="304.41" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">CAS_LAT deep</text><polyline points="903.31,192.76 903.31,292.91 823.94,292.91" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="865.51" y="240.69" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">DQ</text><polyline points="702.99,292.91 687.87,292.91 687.87,419.53 124.72,419.53 124.72,192.76" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="226.77" y="403.21" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">read data, returned in order</text><rect x="30.24" y="464.88" width="944.88" height="60.47" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="35.91" y="480.15" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Every SDRAM output is registered, so a command decided in one cycle is sampled by the device in the next. The timing counters are loaded accordingly; getting that off by one is either a</text><text x="35.91" y="494.89" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">wasted cycle on every row change, or a violation.</text>
</svg>
