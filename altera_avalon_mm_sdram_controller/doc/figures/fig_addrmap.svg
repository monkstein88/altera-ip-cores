<svg xmlns="http://www.w3.org/2000/svg" width="952.4" height="427.1" viewBox="24.6 9.4 952.4 427.1">
<title>fig_addrmap</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker></defs>
<rect x="24.6" y="9.4" width="952.4" height="427.1" fill="#FFFFFF"/>
<text x="37.80" y="42.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="20.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Address map</text><text x="37.80" y="89.11" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">ADDR_MAP 0 - compatible (default). The map the SDRAM Controller Intel FPGA IP uses.</text><rect x="37.80" y="109.61" width="120.94" height="41.57" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="98.27" y="134.76" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">ba[1]</text><text x="98.27" y="163.21" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">addr[24]</text><rect x="166.30" y="109.61" width="340.16" height="41.57" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="336.38" y="134.76" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">row</text><text x="336.38" y="163.21" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">addr[23:11]</text><rect x="514.02" y="109.61" width="120.94" height="41.57" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="574.49" y="134.76" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">ba[0]</text><text x="574.49" y="163.21" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">addr[10]</text><rect x="642.52" y="109.61" width="321.26" height="41.57" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="803.15" y="134.76" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">column</text><text x="803.15" y="163.21" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">addr[9:0]</text><text x="37.80" y="196.69" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">The bank bits are SPLIT: bank[0] sits directly above the column, so a purely ascending address alternates bank every 1024 words and advances the row every 2048. Even a perfectly</text><text x="37.80" y="211.42" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">sequential stream changes bank constantly - which a one-open-row design pays for and this one does not.</text><text x="37.80" y="266.75" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="13.33" font-weight="bold" fill="#000000" xml:space="preserve">ADDR_MAP 1 - conventional. New designs only.</text><rect x="37.80" y="287.24" width="468.66" height="41.57" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="272.13" y="312.40" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">row</text><text x="272.13" y="340.85" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">addr[24:12]</text><rect x="521.57" y="287.24" width="120.94" height="41.57" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="582.05" y="312.40" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">bank</text><text x="582.05" y="340.85" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">addr[11:10]</text><rect x="657.64" y="287.24" width="306.14" height="41.57" fill="#FFFFFF" stroke="#808080" stroke-width="0.76"/><text x="810.71" y="312.40" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">column</text><text x="810.71" y="340.85" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">addr[9:0]</text><rect x="37.80" y="362.83" width="925.98" height="60.47" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="43.46" y="378.11" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Selecting the conventional map moves every address in memory. It is the right choice for a new design and the wrong one for replacing the Intel core in a system that already exists,</text><text x="43.46" y="392.84" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">which is why the component's validation warns about it at generation time.</text>
</svg>
