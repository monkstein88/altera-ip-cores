<svg xmlns="http://www.w3.org/2000/svg" width="948.7" height="404.4" viewBox="24.6 9.4 948.7 404.4">
<title>fig_context</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker></defs>
<rect x="24.6" y="9.4" width="948.7" height="404.4" fill="#FFFFFF"/>
<text x="37.80" y="42.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="20.00" font-weight="bold" fill="#1F3864" xml:space="preserve">System context</text><rect x="37.80" y="90.71" width="211.65" height="98.27" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="143.62" y="127.36" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">Avalon-MM master</text><text x="143.62" y="162.03" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">Nios II, DMA, or plain RTL</text><rect x="340.16" y="75.59" width="302.36" height="128.50" fill="#FDE9D9" stroke="#843C0C" stroke-width="3.02"/><text x="491.34" y="124.87" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">avalon_mm_sdram_controller</text><text x="491.34" y="166.47" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">one open row per bank</text><rect x="733.23" y="90.71" width="226.77" height="98.27" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="846.61" y="118.70" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">SDR SDRAM device</text><text x="846.61" y="153.36" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">4 banks x 8192 rows</text><text x="846.61" y="170.70" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">x 1024 columns x 16 bits</text><polyline points="249.45,139.84 340.16,139.84" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="294.80" y="119.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">s1</text><text x="294.80" y="132.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">word-addressed</text><polyline points="642.52,139.84 733.23,139.84" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="687.87" y="119.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">wire</text><text x="687.87" y="132.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">conduit</text><rect x="340.16" y="234.33" width="302.36" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="491.34" y="252.07" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">clk / reset_n</text><text x="491.34" y="281.54" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">the clock rate is taken from the connected clock source</text><polyline points="491.34,234.33 491.34,204.09" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="37.80" y="317.48" width="922.20" height="83.15" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="43.46" y="332.75" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">The same three interfaces the SDRAM Controller Intel FPGA IP presents: a word-addressed Avalon-MM memory slave named s1 carrying the legacy az_/za_ signals, a conduit</text><text x="43.46" y="347.49" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">named wire carrying the SDRAM pins, and a clock and reset sink. Swapping one component for the other in an existing Platform Designer system leaves every connection and every</text><text x="43.46" y="362.22" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">address assignment alone.</text>
</svg>
