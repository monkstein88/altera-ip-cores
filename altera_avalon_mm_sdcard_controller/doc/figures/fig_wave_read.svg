<text x="10" y="162" font-size="10" fill="#404040">CMD17 READ_SINGLE_BLOCK, after the R1. The card may take as long as it likes before the block arrives, so the core sits in RD_TOKEN clocking 0xFF</text>
<text x="24" y="178" font-size="10" fill="#404040">until it sees a token.</text>
<text x="10" y="194" font-size="10" fill="#404040">0xFE is the start-of-block token. Anything with the top four bits clear is a data error token instead, and the core reports it in ERR_INFO rather</text>
<text x="24" y="210" font-size="10" fill="#404040">than treating the byte as data.</text>
<text x="10" y="226" font-size="10" fill="#404040">The 512 data bytes follow immediately, then a two-byte CRC16. The FIFO count rises as they land; the DMA drains it in parallel, which is why the</text>
<text x="24" y="242" font-size="10" fill="#404040">count does not simply climb to 512.</text>
</svg>