nejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="514.02,111.50 551.81,111.50" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="702.99,111.50 740.79,111.50" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><rect x="551.81" y="154.96" width="151.18" height="37.80" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="627.40" y="178.23" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_R1B_BUSY</text><polyline points="627.40,132.28 627.40,154.96" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="706.77" y="172.66" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">R1b only</text><polyline points="820.16,132.28 820.16,215.43 109.61,215.43 109.61,241.89" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="340.16" y="227.46" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">if CMD.DATA_EN</text><text x="37.80" y="254.73" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="12.67" font-weight="bold" fill="#2E7D32" xml:space="preserve">Read path</text><rect x="37.80" y="264.57" width="143.62" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="109.61" y="289.72" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_DAT_START</text><rect x="219.21" y="264.57" width="143.62" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="291.02" y="289.72" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_RD_TOKEN</text><rect x="400.63" y="264.57" width="128.50" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="464.88" y="289.72" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_RD_DATA</text><rect x="566.93" y="264.57" width="128.50" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="631.18" y="289.72" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_RD_CRC</text><polyline points="181.42,285.35 219.21,285.35" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="362.83,285.35 400.63,285.35" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="529.13,285.35 566.93,285.35" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="37.80" y="334.10" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="12.67" font-weight="bold" fill="#2E7D32" xml:space="preserve">Write path</text><rect x="37.80" y="343.94" width="143.62" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="109.61" y="369.09" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_WR_TOKEN</text><rect x="219.21" y="343.94" width="128.50" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="283.46" y="369.09" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_WR_DATA</text><rect x="385.51" y="343.94" width="128.50" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="449.76" y="369.09" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_WR_CRC</text><rect x="551.81" y="343.94" width="136.06" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="619.84" y="369.09" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_WR_RESP</text><rect x="725.67" y="343.94" width="136.06" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="793.70" y="369.09" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_WR_TAIL</text><polyline points="181.42,364.72 219.21,364.72" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="347.72,364.72 385.51,364.72" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="514.02,364.72 551.81,364.72" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="687.87,364.72 725.67,364.72" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="109.61,306.14 109.61,343.94" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><rect x="37.80" y="423.31" width="143.62" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="109.61" y="448.46" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_BLOCK_END</text><rect x="219.21" y="423.31" width="166.30" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="302.36" y="448.46" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_PRE_BUSY_W</text><rect x="423.31" y="423.31" width="143.62" height="41.57" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="495.12" y="448.46" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_STOP_TRAN</text><rect x="604.72" y="423.31" width="120.94" height="41.57" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.89"/><text x="665.20" y="448.46" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_DONE</text><rect x="778.58" y="423.31" width="120.94" height="41.57" fill="#FDECEC" stroke="#C00000" stroke-width="1.89"/><text x="839.06" y="448.46" text-anchor="middle" font-family="DejaVu Sans Mono, sans-serif" font-size="12.00" fill="#000000" xml:space="preserve">S_ABORT</text><polyline points="695.43,285.35 929.76,285.35 929.76,411.97 109.61,411.97 109.61,423.31" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="861.73,364.72 903.31,364.72 903.31,406.30 109.61,406.30 109.61,423.31" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="181.42,444.09 219.21,444.09" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><text x="162.52" y="424.00" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">more blocks</text><polyline points="385.51,444.09 423.31,444.09" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="566.93,444.09 604.72,444.09" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="778.58,444.09 725.67,444.09" fill="none" stroke="#C00000" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="37.80" y="506.46" width="891.97" height="98.27" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="43.46" y="521.73" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Twenty states. Error exits are not drawn - every state has one, and they all converge on S_ABORT, which is the point of having it. What matters is where S_ABORT goes: not</text><text x="43.46" y="536.46" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">straight to S_IDLE but through S_DONE, so the DMA is told to abort and then allowed to drain. An Avalon master that simply stops issuing beats part-way through a burst hangs</text><text x="43.46" y="551.19" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">the interconnect, so abandoning a transfer is more work than not starting one. S_PRE_BUSY free-runs 0xFF with CS high before every command, which is why the shifter is</text><text x="43.46" y="565.93" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">always already running when a sending state is entered - a fact the assertion suite depends on and documents.</text>
</svg>
