<text x="10" y="162" font-size="10" fill="#404040">One byte on the wire: MOSI = 0x40, MISO = 0xFF, most significant bit first.</text>
<text x="10" y="178" font-size="10" fill="#404040">CPOL = 0, CPHA = 0. MOSI changes on the falling edge of sd_clk; both ends sample on the rising edge.</text>
<text x="10" y="194" font-size="10" fill="#404040">Each column is one host clock. At CLKDIV = 1 the SPI clock is clk/2, so one SPI bit is two columns.</text>
