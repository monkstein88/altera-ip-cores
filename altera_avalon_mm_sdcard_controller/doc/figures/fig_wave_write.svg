<text x="244.0" y="98.9" font-size="9.5" text-anchor="middle" font-family="Liberation Mono, monospace">WR_DATA</text>
<text x="312.0" y="98.9" font-size="9.5" text-anchor="middle" font-family="Liberation Mono, monospace">WR_CRC</text>
<text x="380.0" y="98.9" font-size="9.5" text-anchor="middle" font-family="Liberation Mono, monospace">WR_RESP</text>
<text x="431.0" y="98.3" font-size="7.8" text-anchor="middle" font-family="Liberation Mono, monospace">WR_TAIL</text>
<text x="465.0" y="98.9" font-size="9.5" text-anchor="middle" font-family="Liberation Mono, monospace">DONE</text>
<text x="10" y="132" font-size="10" fill="#404040">CMD24 WRITE_BLOCK, at the end of the block: the last data bytes, the two CRC16 bytes, then the card's</text>
<text x="24" y="148" font-size="10" fill="#404040">data-response token.</text>
<text x="10" y="164" font-size="10" fill="#404040">The token is 0x05. Only five bits carry meaning - the shape is xxx0sss1, and sss = 0b010 is "accepted".</text>
<text x="24" y="180" font-size="10" fill="#404040">Comparing the whole byte against a constant is the classic way to get this wrong.</text>
<text x="10" y="196" font-size="10" fill="#404040">The card then held MISO low for 2 byte-times while it programmed the block. The core reports this as CARD_BUSY</text>
<text x="24" y="212" font-size="10" fill="#404040">in STATUS and will not start the next command until it lifts.</text>
