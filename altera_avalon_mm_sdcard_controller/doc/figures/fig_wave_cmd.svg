<text x="312.0" y="98.9" font-size="9.5" text-anchor="middle" font-family="Liberation Mono, monospace">CMD</text>
<text x="482.0" y="98.9" font-size="9.5" text-anchor="middle" font-family="Liberation Mono, monospace">RESP_WAIT</text>
<text x="567.0" y="98.9" font-size="9.5" text-anchor="middle" font-family="Liberation Mono, monospace">DONE</text>
<text x="10" y="132" font-size="10" fill="#404040">CMD0 GO_IDLE_STATE. Six bytes out: 0x40 | index, four argument bytes, then CRC7 shifted up one with the stop bit in bit 0.</text>
<text x="10" y="148" font-size="10" fill="#404040">The card answered 2 byte-times after the frame. The specification allows N_CR to be anything from 0 to 8, so the core polls for a</text>
<text x="24" y="164" font-size="10" fill="#404040">byte with bit 7 clear rather than waiting a fixed time.</text>
<text x="10" y="180" font-size="10" fill="#404040">R1 = 0x01 is In Idle State, which is the correct answer to CMD0 and not an error.</text>
<text x="10" y="196" font-size="10" fill="#404040">MISO reads 0xFF whenever the card is not driving it - the line is pulled up, and the host clocks 0xFF out to generate the clock.</text>
