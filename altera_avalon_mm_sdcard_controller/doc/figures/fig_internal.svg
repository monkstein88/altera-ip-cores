<text x="37.80" y="42.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="20.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Internal structure</text><rect x="52.91" y="68.03" width="702.99" height="287.24" fill="#FDE9D9" stroke="#843C0C" stroke-width="3.02"/><text x="58.58" y="88.04" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">avalon_mm_sdcard_controller</text><rect x="83.15" y="120.94" width="166.30" height="83.15" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="166.30" y="144.55" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_regs</text><text x="166.30" y="174.01" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">17-word CSR</text><text x="166.30" y="188.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">readLatency 1</text><rect x="279.69" y="120.94" width="211.65" height="83.15" fill="#E2EFDA" stroke="#375623" stroke-width="1.89"/><text x="385.51" y="144.55" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_seq</text><text x="385.51" y="174.01" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">20-state protocol engine</text><text x="385.51" y="188.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">commands, tokens, timeouts</text><rect x="521.57" y="120.94" width="188.98" height="83.15" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="616.06" y="144.55" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_spi_phy</text><text x="616.06" y="174.01" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">continuous shifter</text><text x="616.06" y="188.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">one-deep prefetch</text><rect x="83.15" y="241.89" width="166.30" height="64.25" fill="#FFFFFF" stroke="#595959" stroke-width="1.51" stroke-dasharray="4.5,3.0"/><text x="166.30" y="263.41" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_dma</text><text x="166.30" y="278.14" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">USE_DMA</text><text x="166.30" y="292.87" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bursting master</text><rect x="279.69" y="241.89" width="211.65" height="64.25" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="385.51" y="263.41" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_fifo</text><text x="385.51" y="292.87" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">word store + byte packer</text><rect x="521.57" y="241.89" width="86.93" height="64.25" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="565.04" y="278.14" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_crc</text><rect x="623.62" y="241.89" width="86.93" height="64.25" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="667.09" y="278.14" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_clkgen</text><rect x="786.14" y="120.94" width="143.62" height="83.15" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="857.95" y="144.55" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">sd conduit</text><text x="857.95" y="174.01" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">clk mosi</text><text x="857.95" y="188.75" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">miso cs_n</text><polyline points="15.12,147.40 83.15,147.40" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="11.34" y="127.31" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">csr</text><polyline points="83.15,188.98 15.12,188.98" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="11.34" y="202.90" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">irq</text><polyline points="83.15,274.02 15.12,274.02" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="11.34" y="287.94" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">m0</text><polyline points="249.45,162.52 279.69,162.52" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><polyline points="491.34,162.52 521.57,162.52" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><polyline points="710.55,162.52 786.14,162.52" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><polyline points="166.30,204.09 166.30,241.89" fill="none" stroke="#375623" stroke-width="1.89" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw375623)"/><polyline points="249.45,274.02 279.69,274.02" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><polyline points="385.51,204.09 385.51,241.89" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><polyline points="563.15,241.89 563.15,204.09" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><polyline points="665.20,241.89 665.20,204.09" fill="none" stroke="#595959" stroke-width="1.32" stroke-linejoin="round" stroke-linecap="butt"/><text x="400.63" y="216.12" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">bytes</text><text x="525.35" y="216.12" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">every byte</text><text x="668.98" y="216.12" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">strobes</text><rect x="15.12" y="374.17" width="914.65" height="90.71" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="20.79" y="389.44" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">The shifter runs continuously while a transfer is in progress, with a one-deep prefetch, so the next byte is already queued before the current one finishes and the SPI clock never</text><text x="20.79" y="404.18" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">pauses between bytes. That is where the measured 98.1% of line rate comes from - 16,696 SPI clocks to move 2,048 bytes, against a theoretical 16,384. The CRC units are</text><text x="20.79" y="418.91" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">byte-wise rather than bit-serial for the same reason: a bit-serial CRC cannot keep up with a shifter that never stops. _crc computes CRC7 over command frames and CRC16 over</text><text x="20.79" y="433.64" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">data blocks; _clkgen divides the host clock to clk / (2 x CLKDIV) and hands the shifter a rising and a falling strobe rather than a second clock domain.</text>
</svg>
