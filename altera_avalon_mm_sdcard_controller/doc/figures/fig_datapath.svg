<rect x="24.6" y="9.4" width="963.8" height="517.8" fill="#FFFFFF"/>
<text x="37.80" y="42.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="20.00" font-weight="bold" fill="#1F3864" xml:space="preserve">Where a block's bytes go</text><text x="37.80" y="84.66" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="12.67" font-weight="bold" fill="#2E7D32" xml:space="preserve">Read: card to memory</text><rect x="37.80" y="102.05" width="151.18" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="113.39" y="134.52" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">SD card</text><rect x="226.77" y="102.05" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="309.92" y="127.15" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_spi_phy</text><text x="309.92" y="141.89" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">byte at a time</text><rect x="430.87" y="102.05" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="514.02" y="127.15" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_fifo</text><text x="514.02" y="141.89" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">packs 4 bytes</text><rect x="634.96" y="102.05" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="718.11" y="127.15" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_dma</text><text x="718.11" y="141.89" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bursts words</text><rect x="839.06" y="102.05" width="136.06" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="907.09" y="134.52" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">memory</text><polyline points="188.98,130.39 226.77,130.39" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><polyline points="393.07,130.39 430.87,130.39" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><polyline points="597.17,130.39 634.96,130.39" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><polyline points="801.26,130.39 839.06,130.39" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><text x="37.80" y="201.82" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="12.67" font-weight="bold" fill="#2E7D32" xml:space="preserve">Write: memory to card</text><rect x="37.80" y="219.21" width="136.06" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="105.83" y="251.68" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">memory</text><rect x="211.65" y="219.21" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="294.80" y="244.32" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_dma</text><text x="294.80" y="259.05" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">bursts words</text><rect x="415.75" y="219.21" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="498.90" y="244.32" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_fifo</text><text x="498.90" y="259.05" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">unpacks 4 bytes</text><rect x="619.84" y="219.21" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="702.99" y="244.32" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_spi_phy</text><text x="702.99" y="259.05" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">byte at a time</text><rect x="823.94" y="219.21" width="151.18" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="899.53" y="251.68" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">SD card</text><polyline points="173.86,247.56 211.65,247.56" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><polyline points="377.95,247.56 415.75,247.56" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><polyline points="582.05,247.56 619.84,247.56" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><polyline points="786.14,247.56 823.94,247.56" fill="none" stroke="#2E7D32" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw2E7D32)"/><text x="37.80" y="318.99" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="12.67" font-weight="bold" fill="#C00000" xml:space="preserve">Without the DMA (USE_DMA = 0)</text><rect x="37.80" y="336.38" width="151.18" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="113.39" y="368.85" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">SD card</text><rect x="226.77" y="336.38" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="309.92" y="368.85" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_spi_phy</text><rect x="430.87" y="336.38" width="166.30" height="56.69" fill="#DCE6F1" stroke="#1F3864" stroke-width="1.89"/><text x="514.02" y="368.85" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">_fifo</text><rect x="634.96" y="336.38" width="181.42" height="56.69" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="725.67" y="361.48" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">CPU</text><text x="725.67" y="376.22" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">reads DATA, word at a time</text><polyline points="188.98,364.72 226.77,364.72" fill="none" stroke="#C00000" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><polyline points="393.07,364.72 430.87,364.72" fill="none" stroke="#C00000" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><polyline points="597.17,364.72 634.96,364.72" fill="none" stroke="#C00000" stroke-width="2.08" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arwC00000)"/><rect x="37.80" y="423.31" width="937.32" height="90.71" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="43.46" y="438.58" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">The FIFO is word-wide with a byte packer on the card side, because the two ends run at different widths and different rates: the shifter moves one byte per eight SPI clocks, the master</text><text x="43.46" y="453.31" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">moves four bytes per host cycle. Sizing it at two blocks rather than one is what lets the DMA drain block N while the shifter is receiving block N+1, which is where multi-block throughput</text><text x="43.46" y="468.05" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">comes from. In PIO mode the CPU is on a deadline: with no master to keep the buffer moving, software that is slow to service the DATA window starves the shifter and the stall timeout</text><text x="43.46" y="482.78" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">fires.</text>
</svg>
