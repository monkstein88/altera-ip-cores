<text x="202" y="131.0" font-size="10.5" text-anchor="end" fill="#000">S_ABORT entered</text>
<path d="M210,134 L244,134 L278,134 L312,134 L346,134 L380,134 L414,134 L414,117 L448,117" fill="none" stroke="#1F3864" stroke-width="1.6"/>
<text x="10" y="162" font-size="10" fill="#404040">The same read as the previous figure, with the card corrupting the CRC16. The two CRC bytes arrive in</text>
<text x="24" y="178" font-size="10" fill="#404040">RD_CRC exactly as they would if they were right - nothing on the wire says otherwise.</text>
<text x="10" y="194" font-size="10" fill="#404040">The core folds the final byte into the running CRC16 combinationally and checks the result against zero,</text>
<text x="24" y="210" font-size="10" fill="#404040">so the mismatch is known at the end of the last CRC byte rather than a byte later. That is why the check</text>
<text x="24" y="226" font-size="10" fill="#404040">is written that way.</text>
<text x="10" y="242" font-size="10" fill="#404040">S_ABORT is transient - it raises dma_abort and routes on to S_DONE within a cycle or two, which is why it</text>
<text x="24" y="258" font-size="10" fill="#404040">never appears in the state row and needs a row of its own. IRQ_STATUS bit 12 (ERR_DAT_CRC) is set, and any</text>
<text x="24" y="274" font-size="10" fill="#404040">DMA still in flight is drained rather than cut off mid-burst - an Avalon master that stops issuing beats</text>
<text x="24" y="290" font-size="10" fill="#404040">mid-burst hangs the interconnect.</text>
<text x="10" y="306" font-size="10" fill="#404040">There is no irq row because it would be a flat 1: DMA_DONE has already raised the pin during the data</text>
<text x="24" y="322" font-size="10" fill="#404040">phase. The pin says something happened; only IRQ_STATUS says what, which is why a handler must read it</text>
<text x="24" y="338" font-size="10" fill="#404040">rather than infer the cause from the interrupt alone.</text>
</svg>