<svg xmlns="http://www.w3.org/2000/svg" width="933.5" height="464.9" viewBox="24.6 9.4 933.5 464.9">
<title>fig_context</title>
<defs><marker id="arw1F3864" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1F3864"/></marker><marker id="arw1F3864s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#1F3864"/></marker><marker id="arw2E7D32" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#2E7D32"/></marker><marker id="arw2E7D32s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#2E7D32"/></marker><marker id="arw375623" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#375623"/></marker><marker id="arw375623s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#375623"/></marker><marker id="arwC00000" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#C00000"/></marker><marker id="arwC00000s" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#C00000"/></marker></defs>
<rect x="24.6" y="9.4" width="933.5" height="464.9" fill="#FFFFFF"/>
<text x="37.80" y="42.96" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="20.00" font-weight="bold" fill="#1F3864" xml:space="preserve">System context</text><rect x="37.80" y="83.15" width="204.09" height="75.59" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="139.84" y="108.46" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">Nios II</text><text x="139.84" y="143.13" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">or any Avalon-MM master</text><rect x="37.80" y="181.42" width="204.09" height="68.03" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="139.84" y="202.95" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">System memory</text><text x="139.84" y="237.62" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">SDRAM, on-chip RAM</text><rect x="325.04" y="75.59" width="317.48" height="173.86" fill="#FDE9D9" stroke="#843C0C" stroke-width="3.02"/><text x="483.78" y="147.54" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">avalon_mm_sdcard_controller</text><text x="483.78" y="189.14" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16.00" font-weight="bold" fill="#843C0C" xml:space="preserve">SD / SDHC / SDXC in SPI mode</text><rect x="733.23" y="98.27" width="211.65" height="90.71" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="839.06" y="131.14" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">SD card</text><text x="839.06" y="165.81" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="13.33" fill="#000000" xml:space="preserve">four wires plus power</text><polyline points="241.89,113.39 325.04,113.39" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="283.46" y="93.29" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">csr</text><text x="283.46" y="106.29" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">17 words</text><polyline points="325.04,211.65 241.89,211.65" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="283.46" y="191.56" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">m0</text><text x="283.46" y="204.56" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">bursting master</text><polyline points="325.04,162.52 241.89,162.52" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><text x="283.46" y="142.42" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">irq</text><polyline points="642.52,143.62 733.23,143.62" fill="none" stroke="#1F3864" stroke-width="3.40" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)" marker-start="url(#arw1F3864s)"/><text x="684.09" y="123.53" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">sd</text><text x="684.09" y="136.53" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="10.00" fill="#595959" xml:space="preserve">conduit</text><rect x="325.04" y="287.24" width="317.48" height="49.13" fill="#F2F2F2" stroke="#595959" stroke-width="1.89"/><text x="483.78" y="315.94" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">clk / reset_n</text><polyline points="483.78,287.24 483.78,249.45" fill="none" stroke="#1F3864" stroke-width="1.70" stroke-linejoin="round" stroke-linecap="butt" marker-end="url(#arw1F3864)"/><rect x="37.80" y="362.83" width="907.09" height="98.27" fill="#FFF9E6" stroke="#BF8F00" stroke-width="1.51"/><text x="43.46" y="378.11" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">Two Avalon-MM interfaces, not one. csr is the slave software programs; m0 is a master the core uses to move block data to and from memory itself, so a 512-byte block costs the</text><text x="43.46" y="392.84" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">CPU one command rather than 128 loads and stores. m0 is optional - set USE_DMA to 0 and the interface disappears from the component, leaving software to move every word</text><text x="43.46" y="407.57" text-anchor="start" font-family="Liberation Sans, sans-serif" font-size="11.33" fill="#000000" xml:space="preserve">through the DATA window. The SPI conduit is four wires: clk, mosi, miso and cs_n, plus card-detect and write-protect when USE_CARD_DETECT is set.</text>
</svg>
